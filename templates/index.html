<!DOCTYPE html>
<html>
<head>
    <title>SageBot — Your Knowledge Companion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="static/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="chat-card card mx-auto shadow-sm">
            <div class="card-header d-flex align-items-center justify-content-between">
                <div>
                    <h3 class="mb-0">SageBot</h3>
                    <small class="text-muted">Your Knowledge Companion</small>
                </div>
                <div class="controls d-flex align-items-center">
                    <div id="loading-indicator" class="spinner-border text-primary mr-2" role="status" style="display:none; width:1.4rem; height:1.4rem;">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <button id="clear-btn" class="btn btn-outline-secondary btn-sm">Clear</button>
                </div>
            </div>

            <div class="card-body">
                <div id="chat-container" class="chat-container" aria-live="polite" aria-atomic="false"></div>
            </div>

            <div class="card-footer">
                <div class="row g-2 align-items-center">
                    <div class="col-md-4">
                        <label for="function-select" class="sr-only">Mode</label>
                        <select class="form-control" id="function-select" aria-label="Select mode">
                            <option value="answer">answer as chatbot</option>
                            <option value="kbanswer">answer from knowledgebase</option>
                            <option value="search">search knowledgebase</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="message-input" class="sr-only">Message</label>
                        <input type="text" id="message-input" class="form-control" placeholder="Type your message to SageBot..." autocomplete="off">
                    </div>
                    <div class="col-md-2 d-flex">
                        <button id="send-btn" class="btn btn-primary btn-block">Send</button>
                    </div>
                </div>
                <div id="error-area" style="display:none; margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="static/main.js"></script>
</body>
</html>
